name: checking lintin

on:
  push:
    branches:
      - cicd
jobs:
  lint-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6

      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install black
          pip install ruff

      - name: Run flake8, black and Ruff
        run: |
          flake8 test_file.py
          black test_file.py
          Ruff test_file.py
          

