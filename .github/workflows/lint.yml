name: checking lintin

on:
  push:
    branches:
      - cicd
jobs:
  lint-deploy:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: ["ubuntu-latest","windows-latest","macos-latest"]
        py-version: ['3.10', '3.11','3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py-version }}

      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black ruff

      - name: Run flake8
        run: |
          flake8 test_file.py

      - name: Run black
        run: |
          black --check test_file.py

      - name: Run Ruff
        run: |
          ruff check test_file.py
          

