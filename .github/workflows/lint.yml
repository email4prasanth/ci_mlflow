name: checking lintin

on:
  push:
    branches:
      - cicd
jobs:
  lint-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6

      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: |
          flake8 test_file.py

      - name: Run black
        run: |
          black test_file.py

      - name: Run Ruff
        run: |
          Ruff test_file.py
          

